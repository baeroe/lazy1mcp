name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # config round trip, TUI model tests (forms, JSON editor, toggles) against temp configs
      - run: go test -race -count=1 -v ./...
      # the demo tools for the README screenshots must keep building
      - run: go build -o /dev/null docs/demo/fake1mcp.go
